name: Rebuild and Deploy

on:
  push:
    branches: [main]
  schedule:
    # GitHub's native cron is best-effort and can silently stop firing on
    # low-traffic repos, so this is a backup only — the primary poll is the
    # external repository_dispatch ping below.
    - cron: "*/5 * * * *"
  repository_dispatch:
    # Fired every 5 minutes by an external cron service (FastCron) hitting
    # POST /repos/{owner}/{repo}/dispatches with event_type "poll-check".
    # Unlike workflow_dispatch, this does NOT force a rebuild below — it
    # still goes through the cheap Firestore check first.
    types: [poll-check]
  workflow_dispatch:
    # Manual "Run workflow" trigger (from the Actions tab or `gh workflow
    # run`) always forces a full rebuild, for when you need to force-deploy
    # regardless of the change check.

permissions:
  contents: write

concurrency:
  group: rebuild-deploy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: node scripts/check-products-hash.js

  build-and-deploy:
    needs: check
    if: needs.check.outputs.changed == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build (static export)
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: oniks-guvenlik
          channelId: live

      - name: Refresh product-data hash (post-deploy)
        run: node scripts/check-products-hash.js

      - name: Commit updated hash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet .data-hash || (git add .data-hash && git commit -m "chore: update product data hash [skip ci]" && git push)
